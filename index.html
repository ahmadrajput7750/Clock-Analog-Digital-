<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Chronograph Clock</title>
    <style>
        :root {
            --bg-1: #05070f;
            --bg-2: #0d1730;
            --gold: #e7c886;
            --gold-soft: #f7e7bf;
            --text: #f5f7ff;
            --muted: #a8b2d6;
            --glass: rgba(14, 19, 37, 0.56);
            --stroke: rgba(255, 255, 255, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(1100px 720px at 8% 10%, #1d2f60 0%, transparent 60%),
                radial-gradient(860px 620px at 86% 86%, #31164f 0%, transparent 60%),
                linear-gradient(140deg, var(--bg-1), var(--bg-2));
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: -20%;
            pointer-events: none;
            background: conic-gradient(from 120deg, transparent, rgba(138, 108, 52, 0.24), transparent 35%, rgba(111, 134, 255, 0.22), transparent 70%);
            filter: blur(46px);
            animation: aura 16s linear infinite;
        }

        body::after {
            animation-direction: reverse;
            animation-duration: 24s;
            opacity: 0.6;
        }

        @keyframes aura {
            to {
                transform: rotate(1turn);
            }
        }

        .card {
            position: relative;
            width: min(92vw, 460px);
            border-radius: 30px;
            padding: 34px 28px;
            background: linear-gradient(170deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
            backdrop-filter: blur(22px);
            border: 1px solid var(--stroke);
            box-shadow:
                0 34px 90px rgba(3, 7, 20, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.35),
                inset 0 -36px 70px rgba(4, 5, 20, 0.45);
        }

        .title {
            margin: 0;
            text-align: center;
            font-size: clamp(1.1rem, 2vw, 1.35rem);
            letter-spacing: 0.24em;
            font-weight: 600;
            color: var(--gold-soft);
            text-transform: uppercase;
        }

        .clock {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 24px auto 18px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0) 42%),
                radial-gradient(circle at 50% 58%, rgba(12, 16, 34, 0.95), rgba(5, 8, 19, 0.98));
            border: 1px solid rgba(231, 200, 134, 0.62);
            box-shadow:
                inset 0 0 0 12px rgba(255, 255, 255, 0.03),
                inset 0 0 40px rgba(255, 255, 255, 0.08),
                0 18px 50px rgba(0, 0, 0, 0.55);
        }

        .markers,
        .numbers,
        .hands {
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }

        .marker {
            position: absolute;
            left: 50%;
            top: 8px;
            width: 2px;
            height: 12px;
            margin-left: -1px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.35);
            transform-origin: 50% 117px;
        }

        .marker.main {
            height: 20px;
            top: 4px;
            background: linear-gradient(var(--gold-soft), #b8944f);
            box-shadow: 0 0 8px rgba(231, 200, 134, 0.7);
        }

        .num {
            position: absolute;
            inset: 0;
            font-size: 1rem;
            color: #f6edd8;
            font-weight: 600;
            text-shadow: 0 0 12px rgba(231, 200, 134, 0.42);
        }

        .num span {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            transform-origin: bottom center;
            border-radius: 999px;
            transform: translateX(-50%) rotate(0deg);
            will-change: transform;
        }

        #hour {
            width: 7px;
            height: 62px;
            background: linear-gradient(#ffffff, #a6acc2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
        }

        #minute {
            width: 4px;
            height: 86px;
            background: linear-gradient(#ffffff, #c3d2ff);
            box-shadow: 0 0 11px rgba(255, 255, 255, 0.34);
        }

        #second {
            width: 2px;
            height: 96px;
            background: linear-gradient(#ffd7a0, #c07420);
            box-shadow: 0 0 14px rgba(255, 188, 89, 0.62);
        }

        .center {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 35% 35%, #fff5d7 0%, #d7ab5a 44%, #6f4920 100%);
            box-shadow: 0 0 20px rgba(247, 211, 130, 0.6);
        }

        .digital {
            margin-top: 12px;
            text-align: center;
            font-size: clamp(2rem, 8vw, 2.45rem);
            font-weight: 700;
            letter-spacing: 0.07em;
            color: #f8fbff;
            text-shadow: 0 0 20px rgba(148, 183, 255, 0.35);
        }

        .meta {
            margin-top: 8px;
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
            letter-spacing: 0.04em;
        }

        .chips {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .chip {
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.05);
            color: #dfe6ff;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1 class="title">Premium Chronograph</h1>

        <section class="clock" aria-label="analog clock">
            <div id="markers" class="markers"></div>
            <div id="numbers" class="numbers"></div>
            <div class="hands">
                <div id="hour" class="hand"></div>
                <div id="minute" class="hand"></div>
                <div id="second" class="hand"></div>
            </div>
            <div class="center"></div>
        </section>

        <div id="time" class="digital">00:00:00</div>
        <div id="date" class="meta">Loading date...</div>
        <div class="chips">
            <span class="chip" id="timezone">Local Time</span>
            <span class="chip" id="dayProgress">Day 00%</span>
        </div>
    </main>

    <script>
        const markers = document.getElementById("markers");
        const numbers = document.getElementById("numbers");
        const hourHand = document.getElementById("hour");
        const minuteHand = document.getElementById("minute");
        const secondHand = document.getElementById("second");
        const timeEl = document.getElementById("time");
        const dateEl = document.getElementById("date");
        const dayProgressEl = document.getElementById("dayProgress");

        for (let i = 0; i < 60; i++) {
            const marker = document.createElement("span");
            marker.className = `marker${i % 5 === 0 ? " main" : ""}`;
            marker.style.transform = `rotate(${i * 6}deg)`;
            markers.appendChild(marker);
        }

        for (let i = 1; i <= 12; i++) {
            const num = document.createElement("div");
            const angle = i * 30 - 90;
            const radius = 94;
            const x = 50 + Math.cos((angle * Math.PI) / 180) * (radius / 2.5);
            const y = 50 + Math.sin((angle * Math.PI) / 180) * (radius / 2.5);
            num.className = "num";
            num.innerHTML = `<span style="left:${x}%; top:${y}%">${i}</span>`;
            numbers.appendChild(num);
        }

        function updateClock() {
            const now = new Date();
            const hrs = now.getHours();
            const mins = now.getMinutes();
            const secs = now.getSeconds();
            const ms = now.getMilliseconds();

            const smoothSecs = secs + ms / 1000;
            const smoothMins = mins + smoothSecs / 60;
            const smoothHours = (hrs % 12) + smoothMins / 60;

            hourHand.style.transform = `translateX(-50%) rotate(${smoothHours * 30}deg)`;
            minuteHand.style.transform = `translateX(-50%) rotate(${smoothMins * 6}deg)`;
            secondHand.style.transform = `translateX(-50%) rotate(${smoothSecs * 6}deg)`;

            const ampm = hrs >= 12 ? "PM" : "AM";
            const viewHour = hrs % 12 || 12;
            timeEl.textContent = `${String(viewHour).padStart(2, "0")}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")} ${ampm}`;

            dateEl.textContent = now.toLocaleDateString(undefined, {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            });

            const secondsInDay = hrs * 3600 + mins * 60 + secs;
            const dayPercent = Math.floor((secondsInDay / 86400) * 100);
            dayProgressEl.textContent = `Day ${String(dayPercent).padStart(2, "0")}%`;
        }

        updateClock();
        setInterval(updateClock, 100);
    </script>
</body>

</html>
