<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Glass Clock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: linear-gradient(-45deg, #1e3a8a, #9333ea, #0ea5e9, #6366f1);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .clock-hand {
            transform-origin: bottom center;
            transform: translateX(-50%);
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen">

    <!-- Glass Card -->
    <div class="backdrop-blur-lg bg-white/10 border border-white/20 
                rounded-2xl shadow-2xl p-10 text-center w-[350px]">

        <h1 class="text-white text-2xl font-semibold mb-6">
            Digital Glass Clock
        </h1>

        <!-- Analog Clock -->
        <div class="relative w-52 h-52 mx-auto border-4 border-white/40 rounded-full mb-6">

            <!-- Numbers -->
            <span class="absolute text-white font-bold top-2 left-1/2 -translate-x-1/2">12</span>
            <span class="absolute text-white font-bold bottom-2 left-1/2 -translate-x-1/2">6</span>
            <span class="absolute text-white font-bold right-2 top-1/2 -translate-y-1/2">3</span>
            <span class="absolute text-white font-bold left-2 top-1/2 -translate-y-1/2">9</span>

            <span class="absolute text-white top-6 right-10">1</span>
            <span class="absolute text-white top-14 right-4">2</span>
            <span class="absolute text-white bottom-6 right-10">5</span>
            <span class="absolute text-white bottom-14 right-4">4</span>

            <span class="absolute text-white bottom-6 left-10">7</span>
            <span class="absolute text-white bottom-14 left-4">8</span>
            <span class="absolute text-white top-6 left-10">11</span>
            <span class="absolute text-white top-14 left-4">10</span>

            <!-- Hour Hand -->
            <div id="hour" class="clock-hand absolute w-1 h-14 bg-white left-1/2 bottom-1/2"></div>

            <!-- Minute Hand -->
            <div id="minute" class="clock-hand absolute w-1 h-20 bg-white left-1/2 bottom-1/2"></div>

            <!-- Second Hand -->
            <div id="second" class="clock-hand absolute w-0.5 h-24 bg-red-400 left-1/2 bottom-1/2"></div>

            <!-- Center Dot -->
            <div class="absolute w-3 h-3 bg-white rounded-full 
                left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
            </div>

        </div>

        <!-- Time -->
        <div id="time" class="text-white text-4xl font-bold tracking-wider">
            00:00:00
        </div>

        <!-- Date -->
        <div id="date" class="text-white/80 text-lg mt-4">
            Loading date...
        </div>


    </div>

    <script>
        function updateClock() {

            const now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = "AM";

            // Convert to 12-hour format
            if (hours >= 12) {
                ampm = "PM";
            }

            if (hours > 12) {
                hours = hours - 12;
            }

            if (hours === 0) {
                hours = 12;
            }

            // Add leading zero if needed
            hours = hours < 10 ? "0" + hours : hours;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            // Display time
            document.getElementById("time").innerHTML =
                `${hours}:${minutes}:${seconds} ${ampm}`;

            // Display date
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            };

            document.getElementById("date").innerHTML =
                now.toLocaleDateString(undefined, options);

            // Rotate clock hands
            const hourDeg = (now.getHours() % 12) * 30 + (minutes / 60) * 30;
            const minuteDeg = minutes * 6 + (seconds / 60) * 6;
            const secondDeg = seconds * 6;

            document.getElementById("hour").style.transform =
                `translateX(-50%) rotate(${hourDeg}deg)`;

            document.getElementById("minute").style.transform =
                `translateX(-50%) rotate(${minuteDeg}deg)`;

            document.getElementById("second").style.transform =
                `translateX(-50%) rotate(${secondDeg}deg)`;
        }

        // Run once immediately
        updateClock();

        // Run function every second
        setInterval(updateClock, 1000);

    </script>

</body>

</html>
